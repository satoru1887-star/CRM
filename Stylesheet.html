<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #F6F3EC;
    --paper-raised: #FCFAF5;
    --ink: #1B2E2B;
    --ink-soft: #4B5A56;
    --ink-faint: #8A968F;
    --border: #DAD4C4;
    --gold: #C08A2E;
    --gold-light: #D9A855;
    --gold-dark: #9C6D1F;
    --olive: #4C6B3F;
    --olive-light: #6B8A5B;
    --brick: #9A4A3A;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', 'Noto Sans Thai', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .serif { font-family: var(--serif); font-weight: 600; letter-spacing: 0.1px; }

  .app { display: flex; height: 100vh; }

  /* ===== Sidebar ===== */
  .sidebar {
    width: 216px;
    flex-shrink: 0;
    background: var(--ink);
    color: var(--paper);
    display: flex;
    flex-direction: column;
    padding: 26px 0;
  }

  .brand { padding: 0 24px 24px; border-bottom: 1px solid rgba(246,243,236,0.14); margin-bottom: 18px; }
  .brand-mark { font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--paper); line-height: 1.25; }
  .brand-sub { font-size: 12px; color: rgba(246,243,236,0.55); margin-top: 4px; }

  nav.navlist { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; }

  .navlink {
    display: flex; align-items: baseline; gap: 10px;
    padding: 10px 12px; border-radius: 4px;
    color: rgba(246,243,236,0.72); cursor: pointer;
    font-size: 14.5px; border-left: 2px solid transparent;
  }
  .navlink .navnum { font-family: var(--serif); font-size: 12px; color: rgba(246,243,236,0.4); }
  .navlink:hover { background: rgba(246,243,236,0.06); color: var(--paper); }
  .navlink.active { background: rgba(192,138,46,0.14); color: var(--paper); border-left-color: var(--gold); }
  .navlink.active .navnum { color: var(--gold); }

  .sidebar-foot { margin-top: auto; padding: 16px 24px 0; font-size: 11.5px; color: rgba(246,243,236,0.4); border-top: 1px solid rgba(246,243,236,0.14); }

  /* ===== Main ===== */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .page-head {
    padding: 26px 34px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
  }
  .page-head h1 { margin: 0; font-size: 25px; color: var(--ink); }
  .page-head .desc { margin: 4px 0 0; color: var(--ink-soft); font-size: 13.5px; }

  .head-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  #searchBox {
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 3px;
    font-size: 13.5px; width: 210px; background: var(--paper-raised);
    font-family: var(--sans); color: var(--ink);
  }
  #searchBox:focus { outline: none; border-color: var(--gold); }

  .btn-primary, .btn-secondary, .btn-danger {
    border: 1px solid transparent; border-radius: 3px; padding: 9px 17px;
    font-size: 13.5px; cursor: pointer; font-family: var(--sans); font-weight: 600;
  }
  .btn-primary { background: var(--gold); color: #FFFBF3; }
  .btn-primary:hover { background: var(--gold-dark); }
  .btn-secondary { background: transparent; color: var(--ink-soft); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--ink-soft); color: var(--ink); }
  .btn-danger { background: transparent; color: var(--brick); border-color: var(--brick); }
  .btn-danger:hover { background: var(--brick); color: #FFF; }
  .btn-primary:disabled, .btn-secondary:disabled { opacity: 0.55; cursor: default; }

  .view { display: none; flex: 1; overflow-y: auto; padding: 26px 34px 40px; }
  .view.active { display: block; }

  .loading { text-align: center; padding: 60px 0; color: var(--ink-faint); font-size: 14px; }

  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  .ledger-section-title {
    font-family: var(--serif); font-size: 16px; margin: 30px 0 12px; color: var(--ink);
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .ledger-section-title:first-child { margin-top: 0; }

  /* ===== หน้าแรก: การ์ดส่วนหัว / progress ===== */
  .home-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }

  .panel {
    background: var(--paper-raised); border: 1px solid var(--border); border-radius: 4px; padding: 18px 20px;
  }

  .panel-title { font-family: var(--serif); font-size: 15.5px; margin: 0 0 4px; color: var(--ink); }
  .panel-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .panel-title-row .panel-title { margin: 0; }
  .btn-mini-add {
    border: 1px solid var(--gold); border-radius: 3px; background: transparent; color: var(--gold-dark);
    padding: 4px 11px; font-size: 12px; font-weight: 600; font-family: var(--sans); cursor: pointer; flex-shrink: 0;
  }
  .btn-mini-add:hover { background: var(--gold); color: #FFFBF3; }
  .panel-sub { font-size: 12px; color: var(--ink-soft); margin: 0 0 14px; }

  .target-progress-wrap { margin-top: 6px; }
  .target-numbers { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .target-numbers .achieved { font-family: var(--serif); font-size: 24px; color: var(--olive); }
  .target-numbers .of-target { font-size: 12.5px; color: var(--ink-soft); }
  .progress-track { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--gold); border-radius: 4px; transition: width 0.4s ease; }
  .progress-fill.complete { background: var(--olive); }
  .target-meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--ink-soft); }
  .target-meta a, .target-edit-link { color: var(--gold-dark); cursor: pointer; text-decoration: underline; }

  .list-simple { list-style: none; margin: 0; padding: 0; }
  .list-simple li {
    padding: 11px 0; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; cursor: pointer;
  }
  .list-simple li:last-child { border-bottom: none; }
  .list-simple li:hover { background: rgba(192,138,46,0.05); }
  .li-main .li-name { font-family: var(--serif); font-size: 14.5px; color: var(--ink); }
  .li-main .li-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .li-side { text-align: right; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .badge-overdue { color: var(--brick); font-weight: 600; }
  .badge-today { color: var(--gold-dark); font-weight: 600; }
  .badge-upcoming { color: var(--olive); font-weight: 600; }

  .empty-note { text-align: center; padding: 40px 20px; color: var(--ink-faint); font-size: 13.5px; }

  /* ===== ทะเบียนลูกค้า (ledger table) ===== */
  .ledger-table { width: 100%; border-collapse: collapse; }
  .ledger-table thead th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); padding: 0 10px 10px; border-bottom: 1px solid var(--ink); }
  .ledger-table thead th.num { text-align: right; }
  .th-with-sort { display: flex; align-items: center; gap: 5px; }
  .family-filter-wrap { position: relative; }
  .th-sort-btn {
    border: 1px solid var(--border); border-radius: 3px; background: var(--paper-raised); color: var(--ink-soft);
    padding: 2px 7px; font-size: 11px; cursor: pointer; font-family: var(--sans); line-height: 1.5;
    display: inline-flex; align-items: center; gap: 4px; text-transform: none; font-weight: 600;
    max-width: 130px;
  }
  .th-sort-btn span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 96px; }
  .th-sort-arrow { font-size: 9px; color: inherit; flex-shrink: 0; }
  .th-sort-btn:hover { border-color: var(--gold); color: var(--ink); }
  .th-sort-btn.active { background: var(--gold); border-color: var(--gold); color: #FFFBF3; }

  .family-filter-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 60;
    background: var(--paper-raised); border: 1px solid var(--border); border-radius: 4px;
    box-shadow: 0 6px 18px rgba(27,46,43,0.16); min-width: 200px; max-height: 260px;
    overflow-y: auto; padding: 4px; text-transform: none;
  }
  .family-filter-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 3px; font-size: 13px; font-weight: 400;
    color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .family-filter-item:hover { background: rgba(192,138,46,0.1); }
  .family-filter-item.active { background: var(--gold); color: #FFFBF3; font-weight: 600; }
  .family-filter-item.active .family-filter-count { color: #FFFBF3; }
  .family-filter-count { font-size: 11px; color: var(--ink-faint); }
  .family-filter-empty { padding: 10px; font-size: 12.5px; color: var(--ink-faint); text-align: center; }
  .ledger-row { cursor: pointer; border-bottom: 1px solid var(--border); }
  .ledger-row:hover { background: rgba(192,138,46,0.06); }
  .ledger-row td { padding: 13px 10px; font-size: 13.5px; vertical-align: middle; }
  .ledger-row td.company { font-family: var(--serif); font-size: 15px; color: var(--ink); }
  .ledger-row td.muted { color: var(--ink-soft); }
  .ledger-row td.num { text-align: right; font-family: var(--serif); color: var(--ink); }

  .stage-tag { display: inline-block; font-size: 11.5px; padding: 3px 9px; border-radius: 3px; border: 1px solid currentColor; }

  /* ===== แฟ้มข้อมูลลูกค้า (customer detail) ===== */
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); cursor: pointer; margin-bottom: 14px; }
  .back-link:hover { color: var(--ink); }

  .customer-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .customer-header h2 { margin: 0; font-size: 22px; }
  .customer-header .sub { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
  .tab-btn {
    padding: 10px 14px; font-size: 13.5px; color: var(--ink-soft); cursor: pointer;
    border-bottom: 2px solid transparent; white-space: nowrap; flex-shrink: 0;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--gold); font-weight: 600; }
  .tab-count {
    display: inline-block; min-width: 18px; padding: 1px 6px; margin-left: 4px;
    font-size: 11px; font-weight: 700; line-height: 16px; text-align: center;
    color: var(--gold-dark); background: var(--paper-raised); border: 1px solid var(--gold-light);
    border-radius: 999px;
  }
  .tab-btn.active .tab-count { color: #FFFBF3; background: var(--gold); border-color: var(--gold); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 24px; }
  .info-item .label { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 3px; }
  .info-item .value { font-size: 14.5px; color: var(--ink); }
  .info-item .value.empty { color: var(--ink-faint); font-style: italic; }
  .remark-box { margin-top: 0; padding: 14px; background: var(--paper); border: 1px solid var(--border); border-radius: 4px; font-size: 13.5px; white-space: pre-wrap; }

  .mini-toolbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }

  .mini-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .mini-table th { text-align: left; font-size: 11px; color: var(--ink-soft); font-weight: 600; padding: 0 8px 8px; border-bottom: 1px solid var(--ink); white-space: nowrap; }
  .mini-table td { padding: 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .mini-table tr:hover td { background: rgba(192,138,46,0.05); cursor: pointer; }
  .mini-table td.wrap { white-space: normal; }

  /* ===== รายการแจ้งเตือน ===== */
  .alert-item { padding: 11px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .alert-item:last-child { border-bottom: none; }
  .alert-item:hover { background: rgba(192,138,46,0.05); }
  .alert-row { display: flex; justify-content: space-between; gap: 10px; }
  .alert-label { font-size: 11.5px; color: var(--gold-dark); font-weight: 600; text-transform: none; }
  .alert-name { font-family: var(--serif); font-size: 14.5px; color: var(--ink); margin-top: 2px; }
  .alert-detail { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .alert-due { font-size: 12px; text-align: right; white-space: nowrap; color: var(--ink-soft); }
  .alert-due .text-danger { color: var(--brick); font-weight: 600; }

  /* ===== แจ้งเตือนถึงกำหนดชำระเบี้ย ===== */
  .due-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .due-chip {
    display: inline-block; font-size: 11.5px; color: var(--ink);
    background: rgba(192,138,46,0.08); border: 1px solid var(--border);
    border-radius: 3px; padding: 2px 8px; white-space: nowrap;
  }
  .due-chip-key { color: var(--ink-soft); font-size: 10.5px; margin-right: 3px; }

  /* ===== Deals board ===== */
  .board { display: flex; gap: 14px; align-items: flex-start; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
  .column { border-radius: 4px; flex: 1 1 0; min-width: 210px; display: flex; flex-direction: column; }
  .column-header {
    padding: 0 2px 10px; border-bottom: 2px solid; font-family: var(--serif);
    font-size: 14.5px; color: var(--ink); display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 10px;
  }
  .col-count { font-size: 12px; color: var(--ink-soft); font-family: var(--sans); }
  .column-body { display: flex; flex-direction: column; gap: 8px; min-height: 50px; padding: 2px; border-radius: 4px; }
  .column-body.drag-over { background: rgba(192,138,46,0.08); outline: 1px dashed var(--gold); }

  .card { background: var(--paper-raised); border: 1px solid var(--border); border-left: 3px solid var(--ink); border-radius: 2px; padding: 11px 12px; cursor: grab; }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.4; }
  .card h4 { margin: 0 0 5px; font-size: 14px; font-family: var(--serif); font-weight: 600; color: var(--ink); }
  .card .meta { font-size: 12px; color: var(--ink-soft); margin: 2px 0; }
  .card .value { font-size: 13px; font-family: var(--serif); color: var(--olive); margin-top: 7px; }
  .card .card-detail {
    font-size: 12px; color: var(--ink-soft); margin-top: 6px; white-space: pre-wrap;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .muted-italic { color: var(--ink-faint); font-style: italic; }
  .card .followup-flag { font-size: 11px; color: var(--brick); margin-top: 4px; font-weight: 600; }
  .card-stage-select {
    margin-top: 9px; width: 100%; font-size: 11px; font-family: var(--sans); font-weight: 600;
    color: var(--gold-dark); background: var(--paper); border: 1px solid var(--gold-light);
    border-radius: 3px; padding: 6px 6px; cursor: pointer;
  }
  .card-stage-select:hover { border-color: var(--gold); }

  /* ===== Timeline (ประวัติสถานะดีล) ===== */
  .stage-timeline { list-style: none; margin: 0 0 18px; padding: 0; border-left: 2px solid var(--border); }
  .stage-timeline li { padding: 4px 0 14px 16px; position: relative; }
  .stage-timeline li::before {
    content: ''; position: absolute; left: -6px; top: 6px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--border);
  }
  .stage-timeline li.done::before { background: var(--gold); }
  .stage-timeline .stage-name { font-family: var(--serif); font-size: 13.5px; color: var(--ink); }
  .stage-timeline .stage-date { font-size: 11.5px; color: var(--ink-soft); margin-left: 6px; }
  .stage-timeline .stage-detail { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

  /* ===== Modal (ใช้ร่วมกันทุกฟอร์ม) ===== */
  .modal-overlay { position: fixed; inset: 0; background: rgba(27,46,43,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.hidden, .hidden { display: none !important; }
  .modal { background: var(--paper); border: 1px solid var(--border); border-radius: 4px; padding: 24px 28px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
  .modal.modal-wide { max-width: 560px; }
  .modal h2 { margin: 0 0 4px; font-size: 19px; color: var(--ink); }
  .modal .modal-desc { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 4px; }

  .modal label { display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 13px; margin-bottom: 5px; }
  .modal input, .modal select, .modal textarea {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 3px;
    font-size: 13.5px; font-family: var(--sans); background: var(--paper-raised); color: var(--ink);
  }
  .modal select + input { margin-top: 6px; }
  .modal input:focus, .modal select:focus, .modal textarea:focus { outline: none; border-color: var(--gold); }

  .field-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }

  .modal-actions { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
  .spacer { flex: 1; }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 3px; font-size: 13.5px; z-index: 200; }
  .toast.error { background: var(--brick); }

  /* ===================================================
     Responsive — มือถือ / จอแคบ (<= 720px)
     =================================================== */
  @media (max-width: 720px) {
    html, body { font-size: 14px; }
    .app { flex-direction: column; height: 100vh; }

    .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 10px 12px; flex-shrink: 0; }
    .brand { display: none; }
    .navlist { flex-direction: row; gap: 4px; padding: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; flex: 1; }
    .navlink { flex-shrink: 0; white-space: nowrap; border-left: none; border-bottom: 2px solid transparent; padding: 9px 13px; }
    .navlink.active { border-left: none; border-bottom-color: var(--gold); }
    .sidebar-foot { display: none; }

    .page-head { padding: 16px 16px 14px; flex-direction: column; align-items: stretch; gap: 10px; }
    .page-head h1 { font-size: 21px; }
    .head-actions { width: 100%; flex-wrap: wrap; }
    #searchBox { width: 100%; }
    .head-actions .btn-primary, .head-actions .btn-secondary { width: 100%; text-align: center; padding: 12px 16px; }

    .view { padding: 14px 14px 32px; }

    .home-grid { grid-template-columns: 1fr; }
    .info-grid { grid-template-columns: 1fr; }
    .field-grid-2 { grid-template-columns: 1fr; }

    .board { scroll-snap-type: x mandatory; gap: 12px; }
    .column { min-width: 84vw; max-width: 84vw; scroll-snap-align: start; }

    .card { padding: 13px 14px; }
    .btn-primary, .btn-secondary, .btn-danger { min-height: 42px; }

    .modal-overlay { align-items: flex-end; }
    .modal { max-width: 100%; width: 100%; border-radius: 12px 12px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); max-height: 90vh; }
    .modal input, .modal select, .modal textarea { font-size: 16px; }
    .modal-actions { flex-wrap: wrap; }
    .modal-actions .spacer { display: none; }
    .modal-actions button { flex: 1 1 auto; min-height: 44px; }

    .ledger-table thead th, .mini-table th { font-size: 11px; }
    .ledger-row td, .mini-table td { padding: 11px 8px; font-size: 13px; }
    .ledger-row td.company { font-size: 14px; }

    .toast { width: calc(100% - 32px); text-align: center; }
  }
</style>
